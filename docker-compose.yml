services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    command:
      - anvil
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "5042002"
      - --block-time
      - "2"
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://localhost:8545 >/dev/null"]
      interval: 2s
      timeout: 4s
      retries: 30

  deploy:
    build:
      context: .
      dockerfile: compose-init/Dockerfile.foundry
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      RPC_URL: http://anvil:8545
      DEPLOYER_PRIVATE_KEY: ${DEPLOYER_PRIVATE_KEY}
      ORACLE_SIGNER_ADDRESS: ${ORACLE_SIGNER_ADDRESS}
      ORACLE_SUBMITTER_PRIVATE_KEY: ${ORACLE_SUBMITTER_PRIVATE_KEY}
      RELAYER_ADDRESS: ${RELAYER_ADDRESS}
      DEV_WALLET: ${DEV_WALLET}
    volumes:
      - .:/work
    entrypoint: ["bash", "compose-init/deploy.sh"]
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: compose-init/Dockerfile.foundry
    depends_on:
      deploy:
        condition: service_completed_successfully
    environment:
      RPC_URL: http://anvil:8545
      DEPLOYER_PRIVATE_KEY: ${DEPLOYER_PRIVATE_KEY}
      ORACLE_SUBMITTER_PRIVATE_KEY: ${ORACLE_SUBMITTER_PRIVATE_KEY}
      DEV_WALLET: ${DEV_WALLET}
    volumes:
      - .:/work
    entrypoint: ["bash", "compose-init/seed.sh"]
    restart: "no"
